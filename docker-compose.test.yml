
services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      timeout: 5s
      retries: 5
      
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - DB_URL=postgres://testuser:testpassword@postgres-test:5432/testdb?sslmode=disable
    depends_on:
      postgres-test:
        condition: service_healthy # Will not start until pg_isready passes