version: "2"
linters:
  default: none
  enable:
    - govet
    - misspell
    - revive
    - sloglint
    - staticcheck
    - wsl_v5
  settings:
    wsl:
      allow-assign-and-call: false
      allow-assign-and-anything: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
